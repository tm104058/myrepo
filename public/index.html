<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat App</title>
    <style>
        body { font-family: sans-serif; margin: 20px; display: flex; flex-direction: column; height: 85vh; }
        #messages { list-style-type: none; margin: 0; padding: 0; flex-grow: 1; overflow-y: auto; border: 1px solid #ccc; margin-bottom: 10px; }
        #messages li { padding: 8px; margin-bottom: 4px; background: #f4f4f4; border-radius: 4px; }
        #form { display: flex; }
        #input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <ul id="messages"></ul>
    <form id="form" action="">
        <input id="input" autocomplete="off" placeholder="Type a message..." /><button>Send</button>
    </form>

    <!-- Load the Socket.io client script automatically provided by the server -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');

        // Send message to server when form is submitted
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

		// 1. Function called by Android Kotlin code ---------- Android -> Browser
        function receiveMessageFromAndroid(message) {
            //const msgDiv = document.getElementById('messages');
            //msgDiv.innerHTML += `<p><b>Android:</b> ${message}</p>`;
            
            // Send a response back automatically or based on an event
            //sendResponseToAndroid("Message received loud and clear!");
			if (typeof message !== "string" || !message.trim()) {
				return;
			}

			// Send through the existing Socket.IO connection.
			socket.emit("chat message", message);
			sendResponseToAndroid("Message sent to the chat server.");

        }
		// 2. Function to send data back to Android-------------Browser -> Android
        function sendResponseToAndroid(responseMessage) {
            if (window.AndroidBridge) {
                // 'AndroidBridge' is the name we will define in Kotlin
                window.AndroidBridge.onResponseReceived(responseMessage);
            } else {
                console.log("Not running inside the Android WebView");
            }
		}
		// Listen for broadcasted messages from server
        socket.on('chat message', (msg) => {
            const item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight; // Auto-scroll
        });
    </script>
</body>
</html>
