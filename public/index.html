
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link rel="stylesheet" href="chatapp.css">

    <style>
        [hidden] {
            display: none !important;
        }

        .indivisual-group,
        .indivisual-contact {
            cursor: pointer;
            padding: 12px;
            border-radius: 6px;
            list-style: none;
			touch-action: manipulation;
			-webkit-tap-highlight-color: transparent;
			user-select: none;
        }

        .indivisual-group:hover,
        .indivisual-contact:hover {
            background-color: #e8e8e8;
        }

        .indivisual-group.active,
        .indivisual-contact.active {
            background-color: #dceaff;
            color: #1673d1;
        }

        .dialog-content {
            padding: 20px;
        }

        #create-group-dialog {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dialog-content {
            background: white;
            border-radius: 10px;
            min-width: 280px;
        }

        .dialog-content input {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        #form {
            display: flex;
            gap: 8px;
            padding: 10px;
        }

        #form input[type="text"],
        #form input:not([type]) {
            flex: 1;
            min-width: 0;
        }
    </style>
</head>

<body>

        </div>

        </div>

        </div>

            <ul id="contact-list" class="chat-list">
                <!--<li class="indivisual-contact">Contact 1(Test Contact)</li>-->
            </ul>
        </div>

    </aside>


    <!-- RIGHT CHAT WINDOW -->
    <main id="chat-main">

        <!-- Welcome screen -->
        <div id="chat-welcome">
            <h2>Welcome to Chat</h2>
            <p>Select a group or contact to start messaging.</p>
        </div>

        <!-- Actual chat window -->
        <section id="chat-window" hidden>

            <header id="chat-header">

async function api(path, body) {
	const response = await fetch(path, {
		method: body ? "POST" : "GET",
		credentials: "same-origin",
		headers: body ? { "Content-Type": "application/json" } : {},
		body: body ? JSON.stringify(body) : undefined
	});

	const data = await response.json().catch(() => ({}));

	if (!response.ok) {
		const error = new Error(data.error || "Request failed");
		error.status = response.status;
		throw error;
	}
	auth.hidden = true;
	return data;
}

// OPEN CHAT FUNCTION

function openChat(name, type) { 
    currentChat = {
        name: name,
        type: type
    };
	//
	auth.hidden = true;
    // Hide welcome screen
    chatWelcome.hidden = true;

    // Show chat window
    chatWindow.hidden = false;
	appSection.hidden = false;
	adminSection.hidden = false;
	

    // Display selected group/contact name
    activeChatName.textContent = name;

    // Display status
    activeChatStatus.textContent =
        type === 'group' ? 'Group conversation Users: ' : 'Online';

    // Clear previous messages
    messages.innerHTML = '';

    // Highlight selected item
    document.querySelectorAll(
        '.indivisual-group, .indivisual-contact'
    ).forEach(item => {

        item.classList.remove('active');

        if (item.textContent.trim() === name) {
            item.classList.add('active');
        }

    });
    if (!socket.connected) socket.connect();
}

// Save group

saveRoomBtn.addEventListener('click', async function() {

    const groupName = newRoomInput.value.trim();

    if (!groupName) {
        alert('Please enter group name');
        return;
    }

    // Prevent duplicate group names
    const existingGroups = Array.from(
        roomList.querySelectorAll('.indivisual-group')
    );

    const exists = existingGroups.some(group =>
        group.textContent.trim().toLowerCase() ===
        groupName.toLowerCase()
    );

    if (exists) {
        alert('Group already exists');
        return;
    }

    const li = document.createElement('li');

    li.className = 'indivisual-group';

    li.textContent = groupName;

    roomList.appendChild(li);

    createGroupDialog.hidden = true;

    // Automatically open newly created group
    openChat(groupName, 'group');

	if (!groupName) {
		showMessage("Please enter a room name");
		return;
	}
	try {
	const response = await fetch(`/api/createGroups`, {
	  method: "POST",
	  credentials: "include",
	  headers: {
		"Content-Type": "application/json"
	  },
	  body: JSON.stringify({
		name: groupName
	  })
	});

	const data = await response.json();

	if (!response.ok) throw new Error(data.message);

	showMessage(data.message);
	newRoomInput.value = '';
	
	const roomItem = document.createElement('li');
	roomItem.className = 'room';
	roomItem.id = data.group_id;
	roomItem.dataset.room = groupName;
	roomItem.textContent = groupName;
	roomList.appendChild(roomItem);
	selectedGroupId = data.group_id;
  } catch (error) {
	showMessage(error.message);
  }
});

// ====================================
// FILE UPLOAD
// ====================================

const uploadBtn = document.getElementById('upload-btn');

const fileInput = document.getElementById('file-input');

uploadBtn.addEventListener('click', function() {

    fileInput.click();

});

fileInput.addEventListener('change', async (event) => {
	const file = event.target.files[0];
	if (!file) return;

	// Prepare form data
	const formData = new FormData();
	formData.append('file', file);

	try {
		// Optional: Show a loading/uploading state in your UI here
		uploadBtn.textContent = '⏳'; 

		// Send file to Node.js backend
		const response = await fetch('/api/upload', {
		  method: 'POST',
		  credentials: 'same-origin',
		  body: formData // Content-Type header is automatically set for FormData
		});

		const data = await response.json().catch(() => ({}));
		var fileMsgToChat;
		// Session missing or expired
		if (response.status === 401) {
		  alert('Please log in before uploading files.');
		  return;
		}

		if (!response.ok || !data.success) {
		  throw new Error(data.error || 'Upload failed.');
		}
		if (data.success) {
			fileMsgToChat = data.fileName + ' sent at url ' + data.fileUrl;

			if (socket.connected) {
				socket.timeout(10000).emit("chat message",{
				username: currentUsername,
				message: fileMsgToChat,
				room: String(selectedGroupId)
				},
				(err, response) => {
					if (err) {
						console.error("Server timeout or no acknowledgment:", err);
						return;
					}

					if (response?.success) {
						console.log("Message successfully processed");
					} else {
						console.error("Server rejected message:", response?.error);
						alert(response?.error || "Failed to send message");
					}
				}
				);	
			} else {
				console.error("Socket disconnected");
				alert("You are offline. Please reconnect and try again.");
			}
		} else {
		  alert('Upload failed.');
		}
	} catch (error) {
		console.error('Error uploading file:', error);
	} finally {
		// Reset the icon and input
		uploadBtn.textContent = '➕';
		fileInput.value = ''; 
	}
});

// Called by Kotlin after the user selects a phone number.
  window.onNativeContactSelected = async function (phone) {
    inviteButton.disabled = true;
    inviteStatus.textContent = "Creating invitation...";

    try {
      const response = await fetch("/api/invitations", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ phone })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.error || "Could not create invitation"
        );
      }

      const message =
        "Join me on our chat app! Use this invitation link: " +
        result.inviteUrl;

      inviteStatus.textContent = "Opening SMS app...";

      if (
        !window.AndroidBridge ||
        typeof window.AndroidBridge.openSms !== "function"
      ) {
        throw new Error("Android SMS integration is unavailable");
      }

      window.AndroidBridge.openSms(phone, message);

    } catch (error) {
      inviteStatus.textContent = error.message;
    } finally {
      inviteButton.disabled = false;
    }
};

async function authenticate(action) {
	status.textContent = "";

	try {
	const user = await api("/api/" + action, {
	  username: usernameInput.value.trim(),
	  password: passwordInput.value
	});

	passwordInput.value = "";
	openChat(user);
	} catch (err) {
		status.textContent = err.message;
	}
}


async function verifyadmin() {
	const roomSection = document.getElementById("room-management");
	try{
		const respo = await fetch('/api/checkadmin',
		{
		method: "GET",
		credentials: "include"
		}
		);
		if (!respo.ok) {
			adminSection.style.display = "none";
			return;
		}
		const data = await respo.json();
		isAdmin = true;
	}
	catch(error){
		console.error("Admin verification failed:", error);

	}
}

// FETCH ALL GROUPS AND CONTACTS

async function loadMyGroups(){
	try{
		const resp = await fetch('/api/getMyGroups', {
		credentials: "include"
	});
	const data = await resp.json();
	if (!resp.ok) {
		throw new Error(data.message || "Unable to fetch groups");
	}
	if(data.groups.length == 0){
		showMessage("No groups found");
			return;
	}
	data.groups.forEach(group => {
		const roomItem = document.createElement('li');

		roomItem.className = 'indivisual-group';
		roomItem.id = group._id;
		roomItem.dataset.room = group.name;
		roomItem.textContent = group.name;
		roomList.appendChild(roomItem);
			
	 });
	}catch(error){
		showMessage(error.message);
	}
}
	
	// FETCH ALL USERS
async function fetchUsers() {
  try {
    const response = await fetch(`/api/getallusers`, {
      credentials: "include"
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message);
    }

    users = data.users;
    selectedUsers = [];

    displayUsers();
	displayContacts(data);
  } catch (error) {
    showMessage(error.message);
  }
}
// DISPLAY USERS
function displayContacts(data) {
	if(data.users.length == 0){
		showMessage("No contacts found");
			return;
	}
	data.users.forEach(contact => {
		const eachConact = document.createElement('li');

		eachConact.className = 'indivisual-contact';
		eachConact.id = contact._id;
		eachConact.dataset.contact = contact.username;
		eachConact.textContent = contact.username;
		contactList.appendChild(eachConact);
			
	 });
}
// DISPLAY USERS
function displayUsers() {
  const tbody = document.getElementById("userTableBody");

  document.getElementById("totalUsers").textContent = users.length;

  tbody.innerHTML = "";

  users.forEach(user => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>
        <input type="checkbox"
          class="user-checkbox"
          value="${user._id}"
          onchange="toggleUser('${user._id}')">
      </td>

      <td>${user.username || ""}</td>
	<td>${user.role || ""}</td>
      <td>
        ${user.createdAt
          ? new Date(user.createdAt).toLocaleDateString()
          : "N/A"}
      </td>

      <td>
        <button class="delete-btn"
          onclick="deleteSingleUser('${user._id}')">
          Delete
        </button>
      </td>
    `;

    tbody.appendChild(row);
  });

  document.getElementById("selectAll").checked = false;
  updateBulkButton();
}
// SHOW MESSAGE
function showMessage(message) {
  document.getElementById("message").textContent = message;
}

async function getGroupMessages(selectedGroupId){
	try {
		const response = await fetch(`/api/group/${selectedGroupId}/getMessages`, {
			method: "GET",
			credentials: "include",
			headers: {
				"Content-Type": "application/json"
			}
		});

		const data = await response.json();
		if (!response.ok) {
			throw new Error(data.message || "Failed to fetch messages");
		}

		if (data.success) {
			messages.innerHTML = "";
			data.messages.forEach(message => {
				showGroupMessage({
					username: message.sender.username,
					message: message.content,
					timestamp: message.createdAt
				});
			});
			messages.scrollTop = messages.scrollHeight;
		}

	} catch (error) {
		console.error("Error fetching messages:", error.message);
	}
}
function showGroupMessage(data) {
    const item = document.createElement("li");

    // Compare sender username with logged-in username
    const isMyMessage = String(data.username) === String(currentUsername);

    item.className = isMyMessage
        ? "message message-right"
        : "message message-left";

    // Show username only for other group members
    if (!isMyMessage) {
        const username = document.createElement("div");
        username.classList.add("message-username");
        username.textContent = data.username || "Unknown";
        item.appendChild(username);
    }
    const message = document.createElement("div");
    message.classList.add("message-content");
    message.textContent = data.message;

    item.appendChild(message);

    const time = document.createElement("div");
    time.classList.add("message-time");

    time.textContent = data.timestamp
        ? new Date(data.timestamp).toLocaleTimeString()
        : "";

    item.appendChild(time);

    chatMessages.appendChild(item);
	
    chatMessages.scrollTop = messages.scrollHeight;
}
// Display message
function displayMessages(messages) {
    //const chatMessages = document.getElementById("messages");

    chatMessages.innerHTML = "";

    messages.forEach(message => {
        const div = document.createElement("li");

        const username = document.createElement("strong");

        const content = document.createElement("p");

}

// SELECT / DESELECT USER
function toggleUser(id) {
  if (selectedUsers.includes(id)) {
    selectedUsers = selectedUsers.filter(uid => uid !== id);
  } else {
    selectedUsers.push(id);
  }

  document.getElementById("selectAll").checked =
    users.length > 0 && selectedUsers.length === users.length;

  updateBulkButton();
}
// UPDATE BULK BUTTON
function updateBulkButton() {
  const button = document.getElementById("bulkDelete");

  button.disabled = selectedUsers.length === 0;
  button.textContent = `Delete Selected (${selectedUsers.length})`;
}
// DELETE SINGLE USER
async function deleteSingleUser(id) {
  if (!confirm("Are you sure you want to delete this user?")) return;

  try {
    const response = await fetch(`/users/${id}`, {
      method: "DELETE",
      credentials: "include"
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.message);

    showMessage(data.message);
    await fetchUsers();

  } catch (error) {
    showMessage(error.message);
  }
}
